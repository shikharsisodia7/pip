# FROZEN XcodeGen spec. Generate the project with `xcodegen` in this folder.
name: Pip
options:
  bundleIdPrefix: dev.pipreads
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  PipKit:
    path: PipKit
targets:
  Pip:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
    dependencies:
      - package: PipKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pip
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Pip listens while you read aloud.
        NSCameraUsageDescription: Snap a page of any book so you can read it to Pip.
        NSSpeechRecognitionUsageDescription: Pip turns your reading into words so it can light up each word you read.
        NSLocalNetworkUsageDescription: Pip talks to the reading server on this network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pipreads.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      gatherCoverageData: false
